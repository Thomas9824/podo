name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build Next.js (standalone)
        run: pnpm build

      - name: Copy static assets into standalone
        shell: cmd
        run: |
          xcopy /e /i /y ".next\static" ".next\standalone\.next\static"
          xcopy /e /i /y "public" ".next\standalone\public"

      - name: Download Node.js portable (win-x64)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.19.4/node-v20.19.4-win-x64.zip" -OutFile node-win.zip
          Expand-Archive -Path node-win.zip -DestinationPath node-win-extracted
          Move-Item "node-win-extracted\node-v20.19.4-win-x64" "node-portable"

      - name: Assemble app folder with robocopy
        shell: cmd
        run: |
          mkdir app\server
          mkdir app\node
          robocopy ".next\standalone" "app\server" /e /nfl /ndl /njh /njs
          robocopy "node-portable" "app\node" /e /nfl /ndl /njh /njs
          exit /b 0

      - name: Write launcher.js into app\server
        shell: pwsh
        run: |
          @'
const { spawn } = require('child_process');
const http = require('http');
const path = require('path');
const { exec } = require('child_process');
const fs = require('fs');

const PORT = 3000;
const base = __dirname;
const serverScript = path.join(base, 'server.js');

if (!fs.existsSync(serverScript)) {
  fs.writeFileSync(path.join(base, 'error.log'),
    'server.js introuvable dans : ' + base + '\n' +
    'Contenu : ' + fs.readdirSync(base).join(', '));
  process.exit(1);
}

const srv = spawn(process.execPath, [serverScript], {
  env: { ...process.env, PORT: String(PORT), HOSTNAME: '127.0.0.1', NODE_ENV: 'production' },
  stdio: 'ignore',
  detached: true,
  cwd: base,
});
srv.unref();

let done = false;
function poll(n) {
  if (done || n <= 0) return;
  http.get('http://localhost:' + PORT, () => {
    done = true;
    exec('start "" "http://localhost:' + PORT + '"');
  }).on('error', () => setTimeout(() => poll(n - 1), 700));
}
poll(60);
'@ | Set-Content -Encoding utf8 "app\server\launcher.js"

      - name: Write Demarrer.bat
        shell: pwsh
        run: |
          @'
@echo off
cd /d "%~dp0"
echo Demarrage du dashboard...
echo.
"%~dp0node\node.exe" "%~dp0server\launcher.js"
echo.
echo Le serveur s est arrete. Code erreur : %errorlevel%
pause
'@ | Set-Content -Encoding ascii "app\Demarrer.bat"

      - name: Write Go source
        shell: pwsh
        run: |
          @'
package main

import (
	"fmt"
	"net/http"
	"os"
	"os/exec"
	"path/filepath"
	"time"
)

func main() {
	exe, err := os.Executable()
	if err != nil {
		fmt.Println("Erreur:", err)
		time.Sleep(5 * time.Second)
		return
	}
	dir := filepath.Dir(exe)
	nodeExe := filepath.Join(dir, "node", "node.exe")
	serverJS := filepath.Join(dir, "server", "launcher.js")

	// Verifie que les fichiers existent
	for _, f := range []string{nodeExe, serverJS} {
		if _, err := os.Stat(f); os.IsNotExist(err) {
			msg := "Fichier manquant: " + f
			exec.Command("cmd", "/c", "echo "+msg+" && pause").Run()
			return
		}
	}

	cmd := exec.Command(nodeExe, serverJS)
	cmd.Dir = filepath.Join(dir, "server")
	if err := cmd.Start(); err != nil {
		exec.Command("cmd", "/c", "echo Erreur lancement node: "+err.Error()+" && pause").Run()
		return
	}

	url := "http://localhost:3000"
	for i := 0; i < 60; i++ {
		time.Sleep(700 * time.Millisecond)
		resp, err := http.Get(url)
		if err == nil {
			resp.Body.Close()
			exec.Command("cmd", "/c", "start", "", url).Start()
			break
		}
	}
	select {}
}
'@ | Set-Content -Encoding utf8 "main.go"

      - name: Build dashboard.exe (Go, no console window)
        shell: pwsh
        run: |
          go build -ldflags="-H windowsgui" -o "app\dashboard.exe" main.go

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "app\*" -DestinationPath "dashboard-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-windows
          path: dashboard-windows.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dashboard Revenus Podologue — Windows"
          body: |
            ## 📥 Installation

            1. Télécharger **dashboard-windows.zip**
            2. Clic droit → **Extraire tout** → Bureau par exemple
            3. Ouvrir le dossier extrait
            4. Double-cliquer **dashboard.exe**
            5. Le navigateur s'ouvre ✅

            > Si Windows bloque : **"Informations complémentaires" → "Exécuter quand même"**
            >
            > ⚠️ Si **dashboard.exe** ne fait rien : double-cliquer **Demarrer.bat** à la place (affiche les erreurs).

            Node.js inclus — aucune installation requise.
          files: dashboard-windows.zip
          make_latest: true
