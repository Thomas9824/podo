name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build Next.js (standalone)
        run: pnpm build

      - name: Copy static assets into standalone
        shell: cmd
        run: |
          xcopy /e /i /y ".next\static" ".next\standalone\.next\static"
          xcopy /e /i /y "public" ".next\standalone\public"

      - name: Download Node.js portable (win-x64)
        shell: pwsh
        run: |
          $url = "https://nodejs.org/dist/v20.19.4/node-v20.19.4-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node-win.zip
          Expand-Archive -Path node-win.zip -DestinationPath node-win-extracted
          Move-Item "node-win-extracted\node-v20.19.4-win-x64" "node-portable"

      - name: Create app folder structure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "app" -Force
          Copy-Item -Recurse -Force ".next\standalone\*" "app\server\"
          Copy-Item -Force "launcher.js" "app\server\launcher.js"
          New-Item -ItemType Directory -Path "app\node" -Force
          Copy-Item -Recurse -Force "node-portable\*" "app\node\"

      - name: Write launcher script (debug version with log)
        shell: pwsh
        run: |
          $launcher = @'
          const { spawn } = require('child_process');
          const http = require('http');
          const path = require('path');
          const { exec } = require('child_process');
          const fs = require('fs');

          const PORT = 3000;
          const URL = 'http://localhost:' + PORT;

          // Chemin absolu depuis l emplacement du script
          const base = __dirname;
          const serverScript = path.join(base, 'server.js');

          if (!fs.existsSync(serverScript)) {
            const msg = '[ERREUR] server.js introuvable dans : ' + base + '\nContenu : ' + fs.readdirSync(base).join(', ');
            fs.writeFileSync(path.join(base, 'error.log'), msg);
            process.exit(1);
          }

          const server = spawn(process.execPath, [serverScript], {
            env: { ...process.env, PORT: String(PORT), HOSTNAME: '127.0.0.1', NODE_ENV: 'production' },
            stdio: 'ignore',
            detached: true,
            cwd: base,
          });
          server.unref();

          let opened = false;
          function waitForServer(retries) {
            if (retries <= 0) return;
            http.get(URL, (res) => {
              if (!opened) {
                opened = true;
                exec('start "" "' + URL + '"');
              }
            }).on('error', () => {
              setTimeout(() => waitForServer(retries - 1), 600);
            });
          }

          waitForServer(50);
          '@
          $launcher | Out-File -Encoding utf8 "app\server\launcher.js"

      - name: Create Demarrer.bat (fallback visible)
        shell: pwsh
        run: |
          $bat = @'
          @echo off
          cd /d "%~dp0"
          start "" /b "node\node.exe" "server\launcher.js"
          timeout /t 5 /nobreak >nul
          start "" "http://localhost:3000"
          '@
          $bat | Out-File -Encoding ascii "app\Demarrer.bat"

      - name: Write Go source for dashboard.exe
        shell: pwsh
        run: |
          $go_src = @'
          package main

          import (
            "net/http"
            "os"
            "os/exec"
            "path/filepath"
            "runtime"
            "time"
          )

          func exeDir() string {
            exe, err := os.Executable()
            if err != nil {
              return "."
            }
            resolved, err := filepath.EvalSymlinks(exe)
            if err != nil {
              resolved = exe
            }
            return filepath.Dir(resolved)
          }

          func main() {
            dir := exeDir()
            nodeExe := filepath.Join(dir, "node", "node.exe")
            serverJS := filepath.Join(dir, "server", "launcher.js")

            cmd := exec.Command(nodeExe, serverJS)
            cmd.Dir = filepath.Join(dir, "server")
            cmd.Start()

            url := "http://localhost:3000"
            for i := 0; i < 50; i++ {
              time.Sleep(600 * time.Millisecond)
              resp, err := http.Get(url)
              if err == nil {
                resp.Body.Close()
                switch runtime.GOOS {
                case "windows":
                  exec.Command("cmd", "/c", "start", "", url).Start()
                }
                break
              }
            }
            select {}
          }
          '@
          $go_src | Out-File -Encoding utf8 "main.go"

      - name: Build dashboard.exe with Go (pre-installed on runner)
        shell: pwsh
        run: |
          go build -ldflags="-H windowsgui" -o "app\dashboard.exe" main.go

      - name: Zip app folder
        shell: pwsh
        run: |
          Compress-Archive -Path "app\*" -DestinationPath "dashboard-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-windows
          path: dashboard-windows.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dashboard Revenus Podologue — Windows"
          body: |
            ## 📥 Installation

            1. Télécharger **dashboard-windows.zip**
            2. Clic droit → **Extraire tout** → sur le Bureau par exemple
            3. Ouvrir le dossier extrait
            4. Double-cliquer **dashboard.exe**
            5. Le navigateur s'ouvre sur le dashboard ✅

            > Si Windows bloque : **"Informations complémentaires" → "Exécuter quand même"**
            >
            > Si dashboard.exe ne fonctionne pas : double-cliquer **Demarrer.bat** à la place.

            Node.js est inclus — aucune installation requise.
          files: dashboard-windows.zip
          make_latest: true
