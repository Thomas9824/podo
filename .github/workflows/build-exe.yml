name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build Next.js (standalone)
        run: pnpm build

      - name: Copy static assets into standalone
        shell: cmd
        run: |
          xcopy /e /i /y ".next\static" ".next\standalone\.next\static"
          xcopy /e /i /y "public" ".next\standalone\public"

      - name: Download Node.js portable (win-x64)
        shell: pwsh
        run: |
          $url = "https://nodejs.org/dist/v20.19.4/node-v20.19.4-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node-win.zip
          Expand-Archive -Path node-win.zip -DestinationPath node-win-extracted
          Move-Item node-win-extracted\node-v20.19.4-win-x64 node-portable

      - name: Create app folder structure
        shell: cmd
        run: |
          mkdir app
          xcopy /e /i /y ".next\standalone" "app\server"
          copy launcher.js app\server\launcher.js
          mkdir app\node
          xcopy /e /i /y "node-portable" "app\node"

      - name: Create dashboard.bat launcher
        shell: cmd
        run: |
          echo @echo off > app\dashboard.bat
          echo start "" /b "%~dp0node\node.exe" "%~dp0server\launcher.js" >> app\dashboard.bat
          echo timeout /t 4 /nobreak >nul >> app\dashboard.bat
          echo start "" "http://localhost:3000" >> app\dashboard.bat

      - name: Compile dashboard.exe from bat using Bat To Exe Converter (go wrapper)
        shell: pwsh
        run: |
          # Crée un wrapper Go minimaliste qui lance le serveur et ouvre le navigateur
          $go_code = @'
          package main

          import (
            "net/http"
            "os"
            "os/exec"
            "path/filepath"
            "time"
          )

          func main() {
            exeDir, _ := filepath.Abs(filepath.Dir(os.Args[0]))
            nodeExe  := filepath.Join(exeDir, "node", "node.exe")
            serverJs := filepath.Join(exeDir, "server", "launcher.js")

            cmd := exec.Command(nodeExe, serverJs)
            cmd.Dir = filepath.Join(exeDir, "server")
            cmd.Start()

            for i := 0; i < 40; i++ {
              time.Sleep(500 * time.Millisecond)
              resp, err := http.Get("http://localhost:3000")
              if err == nil {
                resp.Body.Close()
                exec.Command("cmd", "/c", "start", "", "http://localhost:3000").Start()
                break
              }
            }

            // Garde le processus vivant
            select {}
          }
          '@
          $go_code | Out-File -Encoding utf8 main.go

          # Télécharge Go si absent
          $gozip = "go1.22.5.windows-amd64.zip"
          Invoke-WebRequest -Uri "https://go.dev/dl/$gozip" -OutFile $gozip
          Expand-Archive -Path $gozip -DestinationPath go-install
          $env:PATH = "$PWD\go-install\go\bin;$env:PATH"
          go build -ldflags "-H windowsgui" -o app\dashboard.exe main.go

      - name: Zip the app folder
        shell: pwsh
        run: |
          Compress-Archive -Path app\* -DestinationPath dashboard-windows.zip

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dashboard Revenus Podologue — Windows"
          body: |
            ## 📥 Installation (30 secondes)

            1. Télécharger **dashboard-windows.zip**
            2. Faire un clic droit → **Extraire tout** → choisir un dossier (ex: Bureau)
            3. Ouvrir le dossier extrait
            4. Double-cliquer sur **dashboard.exe**
            5. Le navigateur s'ouvre automatiquement ✅

            > ⚠️ Windows SmartScreen peut bloquer au premier lancement.
            > Cliquez **"Informations complémentaires" → "Exécuter quand même"**.

            **Aucune installation requise.** Node.js est inclus dans le zip.
          files: dashboard-windows.zip
          make_latest: true
